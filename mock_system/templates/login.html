{% extends "base.html" %}
{% block title %}로그인 - 가나다증권 업무시스템{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>로그인</h1>
  <form id="login-form" method="post" action="{{ url_for('login') }}">
    <div class="field">
      <label for="login-id">아이디</label>
      <input type="text" id="login-id" name="user_id" autocomplete="off">
    </div>
    <div class="field">
      <label for="login-password">비밀번호</label>
      <input type="password" id="login-password" name="password">
    </div>
    <button type="submit" id="login-button" class="btn primary">로그인</button>
    <p class="hint">가상 시스템입니다. 아무 아이디/비밀번호나 입력하면 통과합니다.</p>
  </form>
</section>
{% endblock %}
