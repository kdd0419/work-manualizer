<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>{% block title %}가나다증권 업무시스템{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" id="home-link" href="{{ url_for('menu') }}">가나다증권 본부 업무시스템 <small>(가상)</small></a>
    {% if session.user %}
      <span class="user">
        <span id="current-user">{{ session.user }}</span> 님
        <a id="logout-link" href="{{ url_for('logout') }}">로그아웃</a>
      </span>
    {% endif %}
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}" id="{{ 'save-message' if category == 'success' else 'error-message' }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">이 시스템과 모든 데이터는 교육·시연용으로 지어낸 것입니다.</footer>
</body>
</html>
