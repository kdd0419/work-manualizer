<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가상 시스템 선택</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 15px/1.6 "Pretendard", "Malgun Gothic", sans-serif; color: #1d2433;
      background: radial-gradient(circle at 15% 20%, #dfe8ff, transparent 40%),
                  radial-gradient(circle at 85% 80%, #d7f5ef, transparent 40%), #f4f6fb; }
    h1 { text-align: center; font-size: 26px; margin: 0 0 6px; }
    p.sub { text-align: center; color: #6b7484; margin: 0 0 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 340px)); gap: 20px; justify-content: center; }
    a.sys { display: block; padding: 28px; border-radius: 18px; background: #fff; color: inherit; text-decoration: none;
      border: 1px solid #e3e7ef; box-shadow: 0 6px 24px rgba(20,30,60,.07); transition: transform .18s, box-shadow .18s; }
    a.sys:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(20,30,60,.12); }
    .icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; margin-bottom: 14px; }
    .sec .icon { background: #e7edfb; } .uni .icon { background: #e6f6f4; }
    strong { display: block; font-size: 19px; margin-bottom: 4px; }
    span { color: #6b7484; font-size: 14px; }
    .note { text-align: center; color: #8a92a2; font-size: 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <main>
    <h1>녹화할 가상 시스템을 고르세요</h1>
    <p class="sub">두 시스템 모두 교육·시연용으로 지어낸 것입니다.</p>
    <div class="grid">
      <a class="sys sec" id="go-securities" href="{{ url_for('login') }}">
        <div class="icon">📈</div>
        <strong>가나다증권 본부 업무시스템</strong>
        <span>위탁업체 점검 현황 조회 · 일별 거래 집계 · 점검 결과 등록</span>
      </a>
      <a class="sys uni" id="go-portal" href="{{ url_for('portal.login') }}">
        <div class="icon">🎓</div>
        <strong>새솔대학교 통합포털</strong>
        <span>전자출석 · 강의 게시판 댓글</span>
      </a>
    </div>
    <p class="note">실제 회사·학교 시스템은 녹화하지 않습니다.</p>
  </main>
</body>
</html>
