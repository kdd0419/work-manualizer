{% extends "portal/base.html" %}
{% block title %}로그인 - 새솔대학교 통합포털{% endblock %}
{% block content %}
<section class="p-login">
  <div class="p-login-hero">
    <h1>함께 자라는 배움,<br>새솔대학교</h1>
    <p>전자출석과 강의 게시판을 한 곳에서.</p>
    <ul>
      <li>📍 전자출석</li><li>💬 강의 게시판</li><li>📚 수강 과목</li>
    </ul>
  </div>
  <form class="p-card p-login-form" id="portal-login-form" method="post" action="{{ url_for('portal.login') }}">
    <h2>통합 로그인</h2>
    <div class="p-field">
      <label for="portal-id">학번</label>
      <input type="text" id="portal-id" name="student_id" autocomplete="off" placeholder="예: 2026123456">
    </div>
    <div class="p-field">
      <label for="portal-password">비밀번호</label>
      <input type="password" id="portal-password" name="password" placeholder="비밀번호">
    </div>
    <button type="submit" id="portal-login-button" class="p-btn p-btn-primary p-btn-block">로그인</button>
    <p class="p-hint">가상 시스템입니다. 아무 학번·비밀번호로 로그인할 수 있습니다.</p>
  </form>
</section>
{% endblock %}
